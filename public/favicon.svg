<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景圓角方形 (奶油黃) -->
  <rect width="32" height="32" rx="7" fill="#FFF8EC"/>
  
  <!-- 左外耳 (三角形) -->
  <path d="M5 13 L8 4 Q8.5 3.5 9.5 4 L12 11 Z" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- 左內耳 -->
  <path d="M7 11 L8.5 5.5 L10.5 10 Z" fill="#F9C4C4"/>
  
  <!-- 右外耳 (三角形) -->
  <path d="M20 11 L22.5 4 Q23.5 3.5 24 4 L27 13 Z" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- 右內耳 -->
  <path d="M21.5 10 L23.5 5.5 L25 11 Z" fill="#F9C4C4"/>
  
  <!-- 頭部主體 (乳白) -->
  <ellipse cx="16" cy="17.5" rx="11.5" ry="10.5" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="0.8"/>
  
  <!-- 額頭經典貓紋 M 字 -->
  <path d="M15.5 7 L16.5 7 L16 9.5 Z" fill="#3D2B1F"/>
  <path d="M13 7.5 L13.8 8 L13.5 9.5 Z" fill="#3D2B1F"/>
  <path d="M19 7.5 L18.2 8 L18.5 9.5 Z" fill="#3D2B1F"/>
  
  <!-- 左眼 -->
  <ellipse cx="11.5" cy="15.5" rx="2.2" ry="2.4" fill="#3D2B1F"/>
  <circle cx="12.2" cy="14.8" r="0.7" fill="white"/>
  
  <!-- 右眼 -->
  <ellipse cx="20.5" cy="15.5" rx="2.2" ry="2.4" fill="#3D2B1F"/>
  <circle cx="19.8" cy="14.8" r="0.7" fill="white"/>
  
  <!-- 鼻子 (小粉紅) -->
  <polygon points="16,17.2 15.2,16.4 16.8,16.4" fill="#F9C4C4"/>
  
  <!-- 嘴巴 (W型萌嘴) -->
  <path d="M14.2 18 Q15.1 19 16 18 Q16.9 19 17.8 18" fill="none" stroke="#3D2B1F" stroke-width="0.6" stroke-linecap="round"/>
  
  <!-- 腮紅 -->
  <ellipse cx="9.2" cy="18" rx="2" ry="1.1" fill="#F9C4C4" opacity="0.6"/>
  <ellipse cx="22.8" cy="18" rx="2" ry="1.1" fill="#F9C4C4" opacity="0.6"/>
  
  <!-- 鬍鬚 -->
  <line x1="7" y1="17.5" x2="4.5" y2="17.2" stroke="#3D2B1F" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="7" y1="18.5" x2="4" y2="18.5" stroke="#3D2B1F" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="25" y1="17.5" x2="27.5" y2="17.2" stroke="#3D2B1F" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="25" y1="18.5" x2="28" y2="18.5" stroke="#3D2B1F" stroke-width="0.5" stroke-linecap="round"/>
  
  <!-- 微縮薄荷綠口金錢包 -->
  <rect x="11.5" y="25" width="9" height="5.5" rx="2" fill="#A8E6CF" stroke="#3D2B1F" stroke-width="0.8"/>
  <circle cx="15" cy="25" r="1.1" fill="#F4C842" stroke="#3D2B1F" stroke-width="0.4"/>
  <circle cx="17" cy="25" r="1.1" fill="#F4C842" stroke="#3D2B1F" stroke-width="0.4"/>
</svg>