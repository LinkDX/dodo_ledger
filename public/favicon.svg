<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景圓角方形 -->
  <rect width="32" height="32" rx="7" fill="#FFF8EC"/>
  
  <!-- 左耳 -->
  <path d="M7 12 Q7 4 11 5 Q13 9 11 14Z" fill="#F5E6D3"/>
  <path d="M8 12 Q8 6 11 6.5 Q12.5 9 11 13Z" fill="#F9C4C4"/>
  
  <!-- 右耳 -->
  <path d="M25 12 Q25 4 21 5 Q19 9 21 14Z" fill="#F5E6D3"/>
  <path d="M24 12 Q24 6 21 6.5 Q19.5 9 21 13Z" fill="#F9C4C4"/>
  
  <!-- 頭部 -->
  <ellipse cx="16" cy="17" rx="12" ry="11" fill="#FDF6EE"/>
  <ellipse cx="16" cy="17" rx="12" ry="11" fill="none" stroke="#3D2B1F" stroke-width="0.8"/>
  
  <!-- 左眼 -->
  <ellipse cx="11.5" cy="15.5" rx="2.5" ry="2.8" fill="#3D2B1F"/>
  <circle cx="12.5" cy="14.5" r="0.9" fill="white"/>
  
  <!-- 右眼 -->
  <ellipse cx="20.5" cy="15.5" rx="2.5" ry="2.8" fill="#3D2B1F"/>
  <circle cx="21.5" cy="14.5" r="0.9" fill="white"/>
  
  <!-- 鼻子 -->
  <path d="M16 18.5 L15 20 L17 20Z" fill="#F9C4C4"/>
  
  <!-- 嘴巴 -->
  <path d="M13.5 20.5 Q15.5 22 16 21.5 Q16.5 22 18.5 20.5" fill="none" stroke="#3D2B1F" stroke-width="0.7" stroke-linecap="round"/>
  
  <!-- 腮紅 -->
  <ellipse cx="9.5" cy="18" rx="2.2" ry="1.4" fill="#F9C4C4" opacity="0.55"/>
  <ellipse cx="22.5" cy="18" rx="2.2" ry="1.4" fill="#F9C4C4" opacity="0.55"/>
  
  <!-- 薄荷綠錢包（身體下方小裝飾） -->
  <rect x="11.5" y="25" width="9" height="5.5" rx="2" fill="#A8E6CF"/>
  <ellipse cx="16" cy="25" rx="3" ry="1" fill="#F4C842"/>
</svg>