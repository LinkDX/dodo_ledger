<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景圓角方形 (馬卡龍奶油黃) -->
  <rect width="512" height="512" rx="115" fill="#FFF8EC"/>
  
  <!-- 左外耳 (三角形貓耳) -->
  <path d="M102 210 L128 66 Q134 50 146 62 L198 190 Z" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- 左內耳 (粉桃) -->
  <path d="M122 186 L140 88 Q142 82 148 88 L176 175 Z" fill="#F9C4C4"/>
  
  <!-- 右外耳 (三角形貓耳) -->
  <path d="M314 190 L366 62 Q378 50 384 66 L410 210 Z" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- 右內耳 (粉桃) -->
  <path d="M336 175 L364 88 Q370 82 372 88 L390 186 Z" fill="#F9C4C4"/>
  
  <!-- 身體 (乳白) -->
  <ellipse cx="256" cy="370" rx="130" ry="110" fill="#FDF6EE"/>
  <ellipse cx="256" cy="370" rx="130" ry="110" fill="none" stroke="#3D2B1F" stroke-width="8"/>
  
  <!-- 頭部主體 (乳白) -->
  <ellipse cx="256" cy="225" rx="155" ry="140" fill="#FDF6EE"/>
  <!-- 頭部輪廓線 -->
  <ellipse cx="256" cy="225" rx="155" ry="140" fill="none" stroke="#3D2B1F" stroke-width="8"/>
  
  <!-- 額頭貓斑紋 (經典M字條紋) -->
  <path d="M250 95 L262 95 L256 125 Z" fill="#3D2B1F"/>
  <path d="M222 102 L232 107 L230 127 Z" fill="#3D2B1F"/>
  <path d="M290 102 L280 107 L282 127 Z" fill="#3D2B1F"/>
  
  <!-- 左鬍鬚 -->
  <path d="M135 220 Q70 205 50 215" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 232 Q65 232 40 238" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M135 244 Q70 255 50 262" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <!-- 右鬍鬚 -->
  <path d="M377 220 Q442 205 462 215" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M382 232 Q447 232 472 238" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M377 244 Q442 255 462 262" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  
  <!-- 左眼 -->
  <ellipse cx="202" cy="198" rx="26" ry="28" fill="#3D2B1F"/>
  <circle cx="210" cy="190" r="8" fill="white"/>
  <circle cx="194" cy="204" r="4" fill="white"/>
  
  <!-- 右眼 -->
  <ellipse cx="310" cy="198" rx="26" ry="28" fill="#3D2B1F"/>
  <circle cx="302" cy="190" r="8" fill="white"/>
  <circle cx="318" cy="204" r="4" fill="white"/>
  
  <!-- 鼻子 (小粉紅三角形) -->
  <polygon points="256,218 248,208 264,208" fill="#F9C4C4" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- 嘴巴 (W形嘟嘟嘴) -->
  <path d="M238 224 Q247 234 256 224 Q265 234 274 224" fill="none" stroke="#3D2B1F" stroke-width="6" stroke-linecap="round"/>
  
  <!-- 腮紅 -->
  <ellipse cx="174" cy="226" rx="22" ry="12" fill="#F9C4C4" opacity="0.6"/>
  <ellipse cx="338" cy="226" rx="22" ry="12" fill="#F9C4C4" opacity="0.6"/>
  
  <!-- 薰衣草領圈 (戴在大頭下巴邊緣下方，形成完美的項圈空間層次) -->
  <path d="M132 330 Q256 396 380 330" fill="none" stroke="#3D2B1F" stroke-width="28" stroke-linecap="round"/>
  <path d="M132 330 Q256 396 380 330" fill="none" stroke="#C3B1E1" stroke-width="16" stroke-linecap="round"/>
  <!-- 領圈黃金鈴鐺 (完美下移至胸口處) -->
  <circle cx="256" cy="388" r="16" fill="#F4C842" stroke="#3D2B1F" stroke-width="6"/>
  <line x1="241" y1="384" x2="271" y2="384" stroke="#3D2B1F" stroke-width="4"/>
  <circle cx="256" cy="395" r="4.5" fill="#3D2B1F"/>
  
  <!-- 薄荷綠板子 -->
  <rect x="180" y="342" width="152" height="98" rx="22" fill="#A8E6CF" stroke="#3D2B1F" stroke-width="8"/>
  <!-- 板子上緣一個圓形小鈴鐺 -->
  <path d="M251 338 Q256 332 261 338" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="350" r="11" fill="#F4C842" stroke="#3D2B1F" stroke-width="4"/>
  <path d="M248 350 H264" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="355" r="3.5" fill="#3D2B1F"/>
  <!-- 板子中央裝飾 -->
  <circle cx="256" cy="391" r="14" fill="#FFF8EC" stroke="#3D2B1F" stroke-width="4"/>
  <circle cx="256" cy="391" r="6" fill="#F4C842"/>
  
  <!-- 左貓掌 (改成抓板子，不顯示掌印) -->
  <circle cx="174" cy="388" r="25" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="8"/>
  
  <!-- 右貓掌 (改成抓板子，不顯示掌印) -->
  <circle cx="338" cy="388" r="25" fill="#FDF6EE" stroke="#3D2B1F" stroke-width="8"/>
</svg>
