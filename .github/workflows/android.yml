name: Dodo Ledger Android Build Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fix npm exit handler bug by installing stable npm
        run: npm install -g npm@9.8.1

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Production Bundle
        env:
          VITE_APP_PASSWORD_HASH: ${{ secrets.VITE_APP_PASSWORD_HASH }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Release APK with Gradle
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p ./android assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodo-ledger-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish Latest APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 複製並重命名 APK 檔名
          cp android/app/build/outputs/apk/release/app-release.apk dodo-ledger-release.apk
          
          # 刪除舊的 latest release（如果存在），確保覆蓋上傳
          gh release delete latest --yes || true
          
          # 刪除舊的 latest tag（如果存在），避免 tag 衝突
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          
          # 建立新的 latest pre-release 並上傳 APK
          gh release create latest dodo-ledger-release.apk \
            --title "Dodo Ledger 最新 Android 正式版 (Latest Release APK) 🐱" \
            --notes "🐱 這是由 GitHub Actions 自動建置的最新 Android Release 版 APK。免解壓，下載即可直接在手機上安裝！更新時間：$(date +'%Y-%m-%d %H:%M:%S' -u) UTC" \
            --prerelease \
            --target master
